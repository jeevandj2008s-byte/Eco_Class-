services:
  - type: web
    name: bit-energy-twin
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: PASSKEY_SALT
        generateValue: true
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: DEFAULT_EMISSION_FACTOR
        value: "0.71"
      - key: DEFAULT_TARIFF_INR
        value: "8.25"
      - key: SANCTIONED_DEMAND_KVA
        value: "750"
